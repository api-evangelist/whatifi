name: Whatifi
description: >-
  Whatifi is a visual financial modeling and scenario planning platform for
  small and medium businesses, letting founders, fractional CFOs, VFX and gaming
  studios, and startups model, forecast, and share runway, staffing, capacity,
  and profit scenarios without spreadsheets or formulas. The product uses an
  event-based canvas of 30+ pre-built business logic "Events" to build and
  compare "what if" forecasts in real time, and connects to accounting and
  banking data through integrations with Excel, Google Sheets, Xero, QuickBooks,
  Plaid, Railz, and OpenAI. Whatifi is backed by a16z. As of this enrichment
  pass Whatifi publishes a marketing site, a Notion-hosted help center, and a
  web application, but exposes no public developer API, SDK, or webhook surface.
